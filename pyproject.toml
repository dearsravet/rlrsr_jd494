[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dearsravet-rlrsr_jd494"
version = "0.1.0"
description = "统计各来源片段的贡献量与占比，标出强化学习研究员·流水线并行气泡比例上最主要的来源"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "dearsravet" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://dearsravet.github.io"
Repository = "https://github.com/dearsravet/rlrsr_jd494"
Issues = "https://github.com/dearsravet/rlrsr_jd494/issues"

[project.scripts]
rlrsr_jd494 = "rlrsr_jd494:main"

[tool.setuptools]
py-modules = ["rlrsr_jd494"]
